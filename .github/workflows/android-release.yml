name: Android Development Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-release:
    name: build-and-release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: "platform-tools"
      - name: Install required Android SDK platform
        run: sdkmanager "platforms;android-36"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug APK and run unit tests
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Create or update development pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=7 HEAD)"
          tag="snapshot-${short_sha}"
          title="Lan Monitor development snapshot ${short_sha}"
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          notes_file="${RUNNER_TEMP}/release-notes.md"

          cat > "${notes_file}" <<EOF
          Automated development snapshot for commit ${GITHUB_SHA}.

          - APK: debug build for development/testing.
          - Signing: not production-signed.
          - Maturity: development pre-release; functionality may be incomplete.
          EOF

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${apk_path}#lan-monitor-debug.apk" --clobber
            gh release edit "${tag}" --title "${title}" --notes-file "${notes_file}" --prerelease
          else
            gh release create "${tag}" "${apk_path}#lan-monitor-debug.apk" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes-file "${notes_file}" \
              --prerelease
          fi
